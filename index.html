<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ラヂオボタン</title>
    <script type="text/javascript" src="js/radio.js" defer></script>
    <link rel="stylesheet" type="text/css" href="css/radio.css">
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <h1>Choose Channel</h1>
      </header>

      <section class="controls">
        <div class="now-playing" aria-live="polite">
          <span class="label">Now Playing:</span>
          <span id="now-playing">未選択</span>
        </div>
        <audio id="music" preload="none" controls></audio>
      </section>

      <section class="channel-grid" id="channel-grid" aria-label="チャンネル一覧"></section>

      <section class="health-check">
        <div class="health-actions">
          <button id="health-check" type="button">死活チェック</button>
          <span id="health-check-status" class="health-status">未チェック</span>
        </div>
        <ul id="status-list" class="status-list" aria-live="polite"></ul>
      </section>
    </main>
  </body>
</html>
